# Scrape config for the ops box. Target addresses live in targets/*.json (not committed, see the .example files)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: backend
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ['/etc/prometheus/targets/backend.json']

  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.json']
