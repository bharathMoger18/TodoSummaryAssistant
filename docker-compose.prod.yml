# Production stack for the app host. MySQL is not part of it: production uses RDS.
# All values come from the environment; aws/deploy.sh fills them from SSM Parameter Store.
name: todo-summary-assistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/todo-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:?DB_HOST is required}:3306/todo_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?SLACK_WEBHOOK_URL is required}
    ports:
      - "${METRICS_BIND_IP:?METRICS_BIND_IP is required}:8080:8080"
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/todo-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
